name: Watch Ship History

on:
  # Daily at 12:17 UTC (8:17 AM US Eastern daylight time)
  schedule:
    - cron: '17 12 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

  # Dry run on pull requests that change the watcher, to check it can still
  # read the pages. Nothing is saved and no issue is opened.
  pull_request:
    paths:
      - 'ship_watch.py'
      - 'uscn_last_entry.py'
      - '.github/workflows/watch-ship-history.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: watch-ship-history

env:
  # Space-separated hulls to watch, e.g. "cvn73 cvn78"
  HULLS: cvn73

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Check pages (dry run)
        if: github.event_name == 'pull_request'
        run: python ship_watch.py $HULLS --dry-run

      - name: Check pages
        if: github.event_name != 'pull_request'
        run: python ship_watch.py $HULLS

      - name: Save state and open issue
        if: github.event_name != 'pull_request' && hashFiles('ship_watch_issue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ship_watch/
          git diff --staged --quiet || git commit -m "Update ship watch state $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
          tail -n +2 ship_watch_issue.md > issue_body.md
          gh issue create --title "$(head -n 1 ship_watch_issue.md)" --body-file issue_body.md \
            --assignee "${{ github.repository_owner }}"
